spring:
  datasource:
    url: jdbc:mysql://localhost:3306/asyncjobdb
    username: root
    password: admin123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  data:
    redis:
      connect-timeout: 5000ms # Thời gian kết nối
      timeout: 5000ms         # Tăng lên 5 giây thay vì 2 giây mặc định
      lettuce:
        shutdown-timeout: 200ms

  # ── Mailtrap: inbox test email, đăng ký free tại mailtrap.io ──
  mail:
    host: sandbox.smtp.mailtrap.io
    port: 2525
    username: ee68c3357c9725   # ← thay bằng username từ Mailtrap
    password: fb2e83f24305a1   # ← thay bằng password từ Mailtrap
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Ho_Chi_Minh

server:
  port: 8080

# Cấu hình thư mục lưu file PDF
app:
  storage:
    pdf-dir: uploads/pdf
    base-url: http://localhost:8080/files

  email:
    from: "Async Job System <noreply@asyncjob.com>"




# Actuator — expose endpoint /actuator/prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: async-job-system   # tag này xuất hiện trong mọi metric

logging:
  level:
    com.trongtin: DEBUG
  file:
    # Dùng đường dẫn tuyệt đối khớp với thư mục đã tạo trong Dockerfile
    name: /app/logs/spring-boot.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ── Cấu hình Ollama AI ──────────────────────────────
ollama:
  base-url: http://localhost:11434
  # Nếu chạy trong Docker thì đổi thành:
  # base-url: http://host.docker.internal:11434

  model: gemma3:4b
  # Đổi thành llama3.2:8b nếu máy có RAM 16GB+

  enabled: true
  # Đặt false để tắt toàn bộ AI — hệ thống vẫn chạy bình thường

  timeout-seconds: 120
  # AI cần thời gian suy nghĩ — timeout 2 phút