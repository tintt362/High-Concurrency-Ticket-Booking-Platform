spring:
  datasource:
    url: jdbc:mysql://localhost:3306/asyncjobdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: admin
    password: admin123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  # ── Mailtrap: inbox test email, đăng ký free tại mailtrap.io ──
  mail:
    host: sandbox.smtp.mailtrap.io
    port: 2525
    username: ee68c3357c9725   # ← thay bằng username từ Mailtrap
    password: fb2e83f24305a1   # ← thay bằng password từ Mailtrap
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Ho_Chi_Minh

server:
  port: 8080

# Cấu hình thư mục lưu file PDF
app:
  storage:
    pdf-dir: uploads/pdf
    base-url: http://localhost:8080/files

  email:
    from: "Async Job System <noreply@asyncjob.com>"
logging:
  level:
    com.example: DEBUG
    org.hibernate.SQL: DEBUG